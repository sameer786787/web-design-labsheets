<section id="contact">
    <h2>Find Our Bakery</h2>

    <div class="map-container">
        <iframe
            src="about:blank"
            title="Bakery location map"
            loading="lazy">
        </iframe>

.map-container {
    width: 100%;
    aspect-ratio: 16 / 9;
}

.map-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
