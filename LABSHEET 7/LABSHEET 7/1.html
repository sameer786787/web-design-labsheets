<!DOCTYPE html>
<html>
<head>
    <title>Online Bookstore</title>
    <style>
        body { font-family: Arial; margin: 0; background: #f4f4f4; }
        header { background: #333; color: white; padding: 20px; text-align: center; }
        nav { background: #ddd; padding: 15px; text-align: center; }
        nav a { margin: 15px; text-decoration: none; color: black; }
        .banner { background: #f9d976; padding: 30px; text-align: center; }
        .books { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: white; padding: 20px; text-align: center; }
        button { background: #333; color: white; padding: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Online Bookstore</h1>
    <input type="text" placeholder="Search books">
    <button>Search</button>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Fiction</a>
    <a href="#">Education</a>
    <a href="#">Technology</a>
</nav>

<div class="banner">
    <h2>Special Book Sale!</h2>
    <p>Discover your next favourite book.</p>
</div>

<h2 style="text-align:center;">Featured Books</h2>

<div class="books">
    <div class="card">
        <h3>Python Programming</h3>
        <p>Price: ₹400</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Web Development</h3>
        <p>Price: ₹350</p>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
