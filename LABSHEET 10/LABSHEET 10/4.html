<?php
require_once __DIR__ . '/../app/controllers/ProductController.php';

$path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);

switch ($path) {
    case '/':
    case '/products':
        $controller = new ProductController();
        $controller->index();
        break;

    default:
        http_response_code(404);
        echo "404 - Page Not Found";
}
?>
