<?php
session_start();

if ($_SERVER["REQUEST_METHOD"] === "POST") {
    $email = $_POST["email"] ?? "";

    // Demonstration only: use real password verification.
    $_SESSION["name"] = $email;

    if (isset($_POST["remember"])) {
        setcookie(
            "remember_email",
            $email,
            [
                "expires" => time() + 604800,
                "path" => "/",
                "secure" => !empty($_SERVER["HTTPS"]),
                "httponly" => true,
                "samesite" => "Lax"
            ]
        );
    }
}

$welcome = $_SESSION["name"] ?? "Guest";
?>

<h2>Welcome, <?= htmlspecialchars($welcome) ?></h2>

<form method="post">
    <input type="email" name="email" placeholder="Email" required>

    <label>
        <input type="checkbox" name="remember">
        Remember Me
    </label>

    <button type="submit">Continue</button>
</form>
